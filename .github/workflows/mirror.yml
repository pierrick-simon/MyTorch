name: mirror.yml
on:
  pull_request:
    branches-ignore:
      - 'ga-ignore-*'
    types:
      - opened
  push:
    branches-ignore:
      - 'ga-ignore-*'

env:
  MIRROR_URL: "git@github.com:EpitechPGE3-2026/G-CNA-501-PAR-5-1-mytorch-7.git"
  BINARY: "my_torch_analyzer, my_torch_generator"


jobs:
  check_valid_repo:
    runs-on: ubuntu-latest
    outputs:
      run_action: ${{ steps.valid.outputs.run_action }}
    steps:
      - name: Verify if in correct repository
        id: valid
        if: ${{ !contains(env.MIRROR_URL, github.repository) }}
        run: echo "run_action=true" >> "$GITHUB_OUTPUT"

  check_program_compilation:
    needs: check_valid_repo
    if: needs.check_valid_repo.outputs.run_action == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Check Binary
        run: |
          for file in $(echo "${{ env.BINARY }}" | sed "s/,/ /g"); do
            if ! [ -x "$file" ]; then
              echo "::error::File '$file' does not exist or is not executable."
              exit 1
            fi
          done

  ruff:
    name: "Ruff"
    needs: check_valid_repo
    uses: ./.github/workflows/ruff.yml
    permissions:
      contents: write
      pull-requests: write

  push_to_mirror:
    needs: [check_valid_repo, check_program_compilation, ruff]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Mirror
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            ${{ env.MIRROR_URL }}
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
